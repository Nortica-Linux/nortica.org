name: Check documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/docs" squidfunk/mkdocs-material:9.7.7 build --strict
      - run: python3 tests/check_site.py site
