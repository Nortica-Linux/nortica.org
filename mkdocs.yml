site_name: Nortica Docs
site_description: Debian for friends you forced linux upon.
site_url: https://docs.nortica.org
repo_url: https://github.com/Nortica-Linux/nortica.org
repo_name: Nortica-Linux/nortica.org
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: media/nortica-symbol.png
  favicon: media/favicon-32.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - First Install: getting-started/index.md
  - Wiki: wiki/index.md
  - Keyboard shortcuts: shortcuts/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/github-issues.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nortica-Linux
      name: Nortica on GitHub
    - icon: fontawesome/brands/debian
      link: https://www.debian.org/
      name: Built on Debian

copyright: Every bug was carefully handcrafted.
